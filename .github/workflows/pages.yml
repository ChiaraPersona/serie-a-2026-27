name: Deploy public site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package committed site and validate size
        run: |
          node scripts/test-package-pages.cjs
          node scripts/package-pages.cjs
      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/pages-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
