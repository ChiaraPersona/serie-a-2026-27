<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102541"><title>Pagina non raggiungibile | Prima del Fischio</title><script src="js/public-presentation.js"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#102541;color:white;font:18px/1.6 system-ui}main{max-width:460px;padding:28px}h1,main>p:first-child{font-family:Georgia,serif;font-weight:700}h1{line-height:1.2}button{padding:14px 22px;border:0;border-radius:12px;font:inherit;cursor:pointer}</style></head><body><main><p>Prima del Fischio</p><h1>Pagina non raggiungibile</h1><p>Non è stato possibile caricare il sito. Può essere un problema temporaneo anche se la connessione Internet è attiva. Riprova tra poco.</p><button onclick="retryPage()">Riprova</button></main><script>
function retryPage() {
  if (location.pathname.endsWith('/offline.html')) location.replace(new URL('./', location.href));
  else location.reload();
}
window.addEventListener('online', retryPage);
</script></body></html>
